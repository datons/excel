[project]
name = "settlement-demo"
version = "0.1.0"
description = "Reference port of the example Settle macro, with its characterization tests."
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project.scripts]
api = "settlement_demo.api:main"
